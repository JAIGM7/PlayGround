<body>
<div class="overlay" id="welcome"><div class="welcome"><div class="welcome-copy"><div class="eyebrow">A living world of wonder</div><h1>Wild<br>Alchemy</h1><p>Step into the Canopy, gather wild elements, and discover the countless things they become. Your story starts with a spark.</p><button class="button" onclick="startGame()">Enter the Canopy <span>→</span></button><div style="font-size:10px;color:#8da495;margin-top:16px">✦ Your progress saves automatically</div></div><div class="welcome-art"><span>🌿</span></div></div></div>
<div class="app hidden" id="app"><header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><strong>WILD ALCHEMY</strong><small>THE CANOPY · SEASON I</small></div></div><nav class="nav" id="nav"><button data-page="home" class="active">⌂ Home</button><button data-page="explore">✦ Explore</button><button data-page="merge">⚗ Merge</button><button data-page="index">▦ Index</button><button data-page="battle">⚔ Battle</button><button data-page="forge">◇ Forge</button><button data-page="studio">✎ Studio</button><button data-page="rank">♜ Ranks</button></nav><div class="resources"><div class="resource"><b>◈</b><span id="coins">120</span></div><div class="resource"><b>✧</b><span id="dust">8</span></div><div class="avatar">🧙</div></div></header>
<div class="main"><main class="view" id="view"></main><aside class="sidebar" id="sidebar"></aside></div></div>
<div class="modal hidden" id="modal"><div class="modal-box" id="modal-box"></div></div><div class="toast" id="toast"></div>
<script>
const BASE=[{name:'Water',icon:'💧',tier:1,element:'water',strength:'Fire',weak:'Earth',color:'#77d8ee'},{name:'Fire',icon:'🔥',tier:1,element:'fire',strength:'Air',weak:'Water',color:'#ff9d67'},{name:'Earth',icon:'🪨',tier:1,element:'earth',strength:'Water',weak:'Air',color:'#c6a674'},{name:'Air',icon:'🌬️',tier:1,element:'air',strength:'Earth',weak:'Fire',color:'#b2d8de'}];
const STATE={page:'home',inventory:{Water:4,Fire:3,Earth:3,Air:3},recipes:{},discovered:new Set(['Water','Fire','Earth','Air']),selected:[],coins:120,dust:8,xp:240,level:4,rank:'Wayfinder',wins:3,explores:0,bossHp:100,playerHp:100,levelNo:1,collection:[],custom:[],customLevels:[],customModes:[],crafted:0,sound:false};
let toastTimer;const $=s=>document.querySelector(s);const safe=(n)=>String(n).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('wildAlchemySave',JSON.stringify({...STATE,discovered:[...STATE.discovered]}))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem('wildAlchemySave'));if(x){Object.assign(STATE,x);STATE.discovered=new Set(x.discovered||[]);STATE.selected=[]}}catch(e){}}
function startGame(){load();$('#welcome').classList.add('hidden');$('#app').classList.remove('hidden');render();save()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2100)}
function allElements(){return [...BASE,...Object.entries(STATE.recipes).map(([name,r])=>({name,icon:r.icon||'✨',tier:r.tier,element:r.element||'arcane',strength:r.strength||'—',weak:r.weak||'—',recipe:r})) ,...STATE.custom.map(x=>({...x,tier:1,custom:true}))]}
function getEl(name){return allElements().find(e=>e.name===name)||{name,icon:'✨',tier:1}}
function pairKey(a,b){return [a,b].sort((x,y)=>x.localeCompare(y)).join(' + ')}
function makeRecipe(a,b){const key=pairKey(a,b);if(STATE.recipes[key])return STATE.recipes[key];const ea=getEl(a),eb=getEl(b),tier=ea.tier+1;if(ea.tier>=5)return null;let name,icon;if(tier===2){const map={['Air + Fire']:['Storm','🌩️'],['Air + Earth']:['Dust','🌪️'],['Air + Water']:['Mist','🌫️'],['Earth + Fire']:['Lava','🌋'],['Earth + Water']:['Mud','🪷'],['Fire + Water']:['Steam','♨️'],['Air + Air']:['Gale','🌀'],['Earth + Earth']:['Mountain','⛰️'],['Fire + Fire']:['Inferno','☄️'],['Water + Water']:['Ice','🧊']};[name,icon]=map[key]||[`${ea.name} ${eb.name}`,'✨']}else{name=`${ea.name} ${eb.name}`;icon=['🌟','🔮','💠','🌌'][Math.min(tier-2,3)]}
let recipe={name,icon,tier,element:tier===2?name.toLowerCase():'arcane',strength:'—',weak:'—',parents:[a,b]};STATE.recipes[key]=recipe;STATE.discovered.add(name);return recipe}
function inventoryCards(filterTier){const names=[...STATE.discovered].filter(n=>(STATE.inventory[n]||0)>0).filter(n=>!filterTier||getEl(n).tier===filterTier);return names.map(n=>{const e=getEl(n);return `<div class="element-card ${STATE.selected.includes(n)?'selected':''}" onclick="selectElement('${safe(n)}')"><span class="count">${STATE.inventory[n]}</span><div class="el-emoji">${e.icon}</div><strong>${safe(n)}</strong><small>T${e.tier} · ${e.element||'wild'}</small></div>`}).join('')||'<div class="notice">Nothing here yet. Head into the forest and gather something wild.</div>'}
function navTo(page){STATE.page=page;STATE.selected=[];render();save()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navTo(b.dataset.page)});
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===STATE.page));$('#coins').textContent=STATE.coins;$('#dust').textContent=STATE.dust;const f={home:homePage,explore:explorePage,merge:mergePage,index:indexPage,battle:battlePage,forge:forgePage,studio:studioPage,rank:rankPage};$('#view').innerHTML=(f[STATE.page]||homePage)();$('#sidebar').innerHTML=sidebar();}
function sidebar(){return `<section class="profile-card"><div class="profile-top"><div class="portrait">🧙</div><div><strong>Fern Walker</strong><small>✦ ${STATE.rank} · Level ${STATE.level}</small></div></div><div class="xp-row"><span>CANOPY RENOWN</span><span>${STATE.xp % 500} / 500 XP</span></div><div class="xp-bar"><i style="width:${STATE.xp%500/5}%"></i></div><div class="stat-row"><div class="stat"><b>${STATE.discovered.size}</b><small>Found</small></div><div class="stat"><b>${STATE.wins}</b><small>Victories</small></div><div class="stat"><b>${STATE.explores}</b><small>Expeditions</small></div></div></section><section class="sidebar-card"><h3>Daily blessing</h3><div class="daily"><span class="daily-icon">🌙</span><p><strong>Moonlit gathering</strong><small>Claim your daily supplies</small></p><button class="mini-button" onclick="claimDaily()">Claim</button></div></section><section class="sidebar-card"><h3>Canopy board</h3><div class="rankline"><span>①</span><span>MossyMoth</span><b>2,840</b></div><div class="rankline"><span>②</span><span>Fern Walker</span><b>${(STATE.xp+1100).toLocaleString()}</b></div><div class="rankline"><span>③</span><span>Emberling</span><b>1,960</b></div><button class="text-link" onclick="navTo('rank')">View all rankings →</button></section><section class="sidebar-card"><h3>Soundscape</h3><div class="daily"><span class="daily-icon">${STATE.sound?'🎵':'🎶'}</span><p><strong>${STATE.sound?'Forest ambience on':'Soft forest ambience'}</strong><small>Procedural, gentle and yours</small></p><button class="mini-button" onclick="toggleSound()">${STATE.sound?'Off':'On'}</button></div></section>`}
function homePage(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">✦ Season of the verdant dawn</div><h1>Where wild things<br>become wonder.</h1><p>Wander beneath the canopy, gather the four first elements, and discover what happens when worlds collide.</p><button class="button" onclick="navTo('explore')">Explore the forest <span>→</span></button></div><div class="hero-art"><div class="sun"></div><div class="forest-art">🌳</div></div></section><div class="section-head"><div><h2>Choose your path</h2><p>Every trail holds a little magic.</p></div><button class="text-link" onclick="navTo('explore')">Open map →</button></div><div class="forest-grid"><button class="biome" data-emoji="🌊" onclick="gather('water')"><span class="level-tag">Trail · 01</span><strong>Whispering Brook</strong><span>Water · gentle & bright</span></button><button class="biome" data-emoji="🔥" onclick="gather('fire')"><span class="level-tag">Trail · 02</span><strong>Emberglow Hollow</strong><span>Fire · warm & untamed</span></button><button class="biome" data-emoji="🍄" onclick="gather('earth')"><span class="level-tag">Trail · 03</span><strong>Mosslight Grove</strong><span>Earth · quiet & ancient</span></button></div><div class="below-grid"><section class="card"><h3>Today in the Canopy</h3><div class="quest"><div class="quest-icon">🍃</div><div class="quest-copy"><strong>Gathering hands</strong><small>Collect 5 elements · ${Math.min(5,STATE.explores)} / 5</small><div class="progress"><i style="width:${Math.min(100,STATE.explores*20)}%"></i></div></div><span class="reward">+35 ◈</span></div><div class="quest"><div class="quest-icon">⚗️</div><div class="quest-copy"><strong>Little alchemist</strong><small>Discover your first new element</small><div class="progress"><i style="width:${STATE.crafted?100:0}%"></i></div></div><span class="reward">+50 XP</span></div></section><section class="card"><h3>First discoveries</h3><div class="recipe-list"><div class="recipe-item"><span>🌊 + 🔥</span><div><strong>Water + Fire</strong><small>A new element is waiting...</small></div><span>?</span></div><div class="recipe-item"><span>🌱 + 🌬️</span><div><strong>Earth + Air</strong><small>Try mixing the unexpected.</small></div><span>?</span></div></div></section></div>`}
function explorePage(){return `<div class="page-title"><div><h1>Explore the Canopy</h1><p>Pick a trail, search the wild, and bring home a little wonder.</p></div><span class="pill">✦ Expedition ${STATE.explores+1}</span></div><section class="hero" style="min-height:180px;margin-bottom:17px"><div class="hero-copy"><div class="eyebrow">A living forest · 4 trails</div><h1 style="font-size:32px">The wild is calling.</h1><p>Every expedition turns up something new. Rare finds glimmer when luck is on your side.</p></div><div class="hero-art"><div class="sun"></div><div class="forest-art">🌲</div></div></section><div class="forest-grid"><button class="biome" data-emoji="💧" onclick="gather('water')"><span class="level-tag">Gather · common</span><strong>Whispering Brook</strong><span>Water · stream stones sparkle</span></button><button class="biome" data-emoji="🔥" onclick="gather('fire')"><span class="level-tag">Gather · uncommon</span><strong>Emberglow Hollow</strong><span>Fire · warmth in the roots</span></button><button class="biome" data-emoji="🪨" onclick="gather('earth')"><span class="level-tag">Gather · common</span><strong>Mosslight Grove</strong><span>Earth · the old forest floor</span></button><button class="biome" data-emoji="🌬️" onclick="gather('air')"><span class="level-tag">Gather · rare</span><strong>Cloudstep Ridge</strong><span>Air · gifts from the high canopy</span></button><button class="biome" data-emoji="🌙" onclick="gather('mystery')"><span class="level-tag">Mystery · chance</span><strong>Moonwell Clearing</strong><span>RNG · something unusual may appear</span></button><button class="biome" data-emoji="🗺️" onclick="navTo('studio')"><span class="level-tag">Community · ${STATE.customLevels.length} made</span><strong>Custom trails</strong><span>Build and play your own levels</span></button></div><div class="section-head"><div><h2>Backpack</h2><p>Gathered elements are ready to merge.</p></div><button class="text-link" onclick="navTo('merge')">Go to alchemy →</button></div><div class="element-grid">${inventoryCards()}</div>`}
function selectElement(name){if((STATE.inventory[name]||0)<1)return;if(STATE.selected.length===0)STATE.selected=[name];else if(STATE.selected.length===1)STATE.selected.push(name);else if(STATE.selected[0]===name&&STATE.selected[1]===name)STATE.selected=[];else STATE.selected=[STATE.selected[1],name];render()}
function mergePage(){const selected=STATE.selected.map(n=>getEl(n));let result='';if(selected.length===2&&selected[0].tier===selected[1].tier){const r=STATE.recipes[pairKey(STATE.selected[0],STATE.selected[1])];result=r?`${r.icon} ${safe(r.name)} · T${r.tier}`:'✨ New discovery!'}else result=selected.length===2?'Only elements of the same tier can merge.':'Choose two elements from your backpack.';return `<div class="page-title"><div><h1>Alchemy table</h1><p>Merge two of the same tier. Nothing crosses tiers—each tier builds the next.</p></div><span class="pill">⚗ ${STATE.crafted} discoveries</span></div><div class="two-col"><section class="content-card"><div class="tier-label">01 · Choose two matching tiers</div><div class="merge-arena"><div class="merge-slot ${selected[0]?'filled':''}">${selected[0]?`<div><span style="font-size:30px">${selected[0].icon}</span><b>${safe(selected[0].name)}</b><span>Tier ${selected[0].tier}</span></div>`:'Select element one'}</div><div class="merge-plus">+</div><div class="merge-slot ${selected[1]?'filled':''}">${selected[1]?`<div><span style="font-size:30px">${selected[1].icon}</span><b>${safe(selected[1].name)}</b><span>Tier ${selected[1].tier}</span></div>`:'Select element two'}</div></div><div class="notice">${result}<br>Tier rule: T1 + T1 → T2, T2 + T2 → T3, T3 + T3 → T4, T4 + T4 → T5.</div><button class="button" onclick="doMerge()" ${selected.length!==2?'disabled':''}>✦ Combine elements</button> <button class="button secondary" onclick="STATE.selected=[];render()">Clear</button><div class="section-head"><div><h2 style="font-size:18px">Your backpack</h2><p>Select two cards to use them.</p></div></div><div class="element-grid">${inventoryCards()}</div></section><section class="content-card"><div class="page-title"><div><h1 style="font-size:24px">Discovery journal</h1><p>Every recipe is one-of-a-kind.</p></div><span class="pill">${Object.keys(STATE.recipes).length} recipes</span></div><div class="notice">The Canopy remembers your discoveries. Combine any pair of T2 elements to create T3, then continue all the way to T5.</div><div class="recipe-list">${Object.values(STATE.recipes).slice(-12).reverse().map(r=>`<div class="recipe-item"><span style="font-size:22px">${r.icon}</span><div><strong>${safe(r.name)} <small>· T${r.tier}</small></strong><small>${r.parents.map(safe).join(' + ')}</small></div><b style="margin-left:auto">${STATE.inventory[r.name]||0}</b></div>`).join('')||'<div class="notice">Your first combination is waiting.</div>'}</div></section></div>`}
function doMerge(){if(STATE.selected.length!==2)return;const [a,b]=STATE.selected,ea=getEl(a),eb=getEl(b);if(ea.tier!==eb.tier){toast('Those tiers cannot be merged together.');return}if((STATE.inventory[a]||0)<(a===b?2:1)||(STATE.inventory[b]||0)<1){toast('You need two copies to merge an element with itself.');return}if(ea.tier>=5){toast('Tier 5 is the final tier.');return}STATE.inventory[a]--;STATE.inventory[b]--;const r=makeRecipe(a,b);if(!r){toast('Tier 5 is the final tier.');return}STATE.inventory[r.name]=(STATE.inventory[r.name]||0)+1;STATE.discovered.add(r.name);STATE.crafted++;STATE.coins+=8;STATE.xp+=25;STATE.selected=[];levelCheck();toast(`Discovery! ${r.icon} ${r.name} · Tier ${r.tier}`);render();save()}
function indexPage(){let els=allElements().filter(e=>STATE.discovered.has(e.name));return `<div class="page-title"><div><h1>Field index</h1><p>A living record of the elements discovered across the Canopy.</p></div><span class="pill">${els.length} discovered · ${allElements().length} known</span></div><div class="notice">All possible pair recipes are generated as you go: each pair within a tier makes its own unique next-tier element. Tier ${Math.min(5,Math.max(1,...els.map(e=>e.tier)))} of 5.</div>${[1,2,3,4,5].map(t=>`<div class="tier-label">Tier ${t} · ${els.filter(e=>e.tier===t).length} discovered</div><div class="element-grid">${els.filter(e=>e.tier===t).map(e=>`<div class="element-card"><div class="el-emoji">${e.icon}</div><strong>${safe(e.name)}</strong><small>${e.custom?'Custom creation':e.recipe?`${safe(e.recipe.parents.join(' + '))}`:`${e.element} · ${e.strength||'wild'}`}</small>${STATE.inventory[e.name]?`<span class="count">${STATE.inventory[e.name]}</span>`:''}</div>`).join('')||'<div class="notice">Not discovered yet. Keep exploring and combining!</div>'}</div>`).join('')}<div class="section-head"><div><h2>Recipe branches</h2><p>Unique combinations discovered so far.</p></div></div><div class="recipe-list">${Object.values(STATE.recipes).map(r=>`<div class="recipe-item"><span>${r.icon}</span><div><strong>${safe(r.name)} · Tier ${r.tier}</strong><small>${r.parents.map(safe).join(' + ')}</small></div></div>`).join('')||'<div class="notice">No recipes yet. The first pair is yours to discover.</div>'}</div>`}
function battlePage(){const hp=Math.max(0,STATE.bossHp),php=Math.max(0,STATE.playerHp);return `<div class="page-title"><div><h1>Boss grove</h1><p>Choose an element before the encounter. Strengths and weaknesses change the tide.</p></div><span class="pill">⚔ ${STATE.wins} victories</span></div><div class="battlefield"><div class="fighter"><div class="big">🧙</div><strong>Fern Walker</strong><div class="hp player"><i style="width:${php}%"></i></div><small>${php} / 100 HP · ${STATE.selected[0]?safe(STATE.selected[0]):'no element selected'}</small></div><div style="font-size:24px;color:#edc879;z-index:1">VS</div><div class="fighter"><div class="big">${STATE.levelNo%3===0?'🐉':STATE.levelNo%3===1?'🦉':'🦌'}</div><strong>${STATE.levelNo%3===0?'Elder Bramblewing':STATE.levelNo%3===1?'Gloamroot Guardian':'Moonhart'}</strong><div class="hp"><i style="width:${hp}%"></i></div><small>${hp} / 100 HP · Weak to ${['water','air','fire'][(STATE.levelNo-1)%3]}</small></div></div><div class="battle-log" id="battlelog">${php<=0?'Catch your breath before facing the grove again.':'The grove waits. Pick a discovered element, then take your turn.'}</div><div class="section-head"><div><h2>Choose your attunement</h2><p>Strengths deal bonus damage; weaknesses are less effective.</p></div></div><div class="element-grid">${inventoryCards()}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="button" onclick="battleTurn()">⚔ Take your turn</button><button class="button secondary" onclick="restBattle()">✦ Rest · 10 ◈</button></div><div class="notice">Element cycle: Water > Fire > Air > Earth > Water. Battle is turn-based; the rival grove responds after every action.</div>`}
function battleTurn(){if(STATE.playerHp<=0||STATE.bossHp<=0){toast('Rest or begin the next encounter.');return}let selected=STATE.selected[0]||'Water',e=getEl(selected),damage=15+e.tier*5;let weakness=['Water','Air','Fire'][(STATE.levelNo-1)%3];if(e.strength===weakness)damage*=1.8;if(e.tier>1)damage+=Math.min(25,e.tier*3);if(STATE.power==='quickstep'){damage+=24;STATE.power=null}STATE.bossHp=Math.max(0,STATE.bossHp-Math.floor(damage));let msg=`${e.icon} ${selected} hits for ${Math.floor(damage)} damage.`;if(STATE.bossHp===0){STATE.wins++;STATE.coins+=45;STATE.dust+=3;STATE.xp+=90;STATE.levelNo++;STATE.bossHp=100;msg+=` Victory! +45 ◈, +3 ✧, +90 XP.`;levelCheck()}else{let hit=8+Math.floor(Math.random()*13);if((e.element||'').toLowerCase()===['fire','earth','air','water'][(STATE.levelNo-1)%4])hit=Math.floor(hit*.65);STATE.playerHp=Math.max(0,STATE.playerHp-hit);msg+=` The boss retaliates for ${hit}.`;if(STATE.playerHp===0)msg+=' Your spirit needs a rest.'}STATE.selected=[];render();$('#battlelog').textContent=msg;save()}
function restBattle(){if(STATE.coins<10){toast('You need 10 coins to rest.');return}STATE.coins-=10;STATE.playerHp=100;STATE.bossHp=100;toast('Rested up. Full health restored!');render();save()}
function forgePage(){return `<div class="page-title"><div><h1>Moonlit forge</h1><p>Trade your finds for little things that make adventures brighter.</p></div><span class="pill">◈ ${STATE.coins} coins · ✧ ${STATE.dust} stardust</span></div><div class="two-col"><section class="content-card"><h2 style="font:23px Georgia,serif">Canopy market</h2><p style="color:var(--muted);font-size:11px">A few wares, all made with care.</p><div class="level-list">${[['🧪','Wild tonic','Restore your health before a boss fight.',35],['✨','Stardust pouch','A pinch of glitter for the crafting table.',55],['🧥','Mossweave cape','A charming forest look.',80],['🔮','Lucky acorn','A little extra luck on your next expedition.',40]].map(([i,n,d,c],idx)=>`<div class="level-item"><span class="emoji">${i}</span><div><strong>${n}</strong><small>${d}</small></div><button class="mini-button" onclick="buyItem(${idx})">${c} ◈</button></div>`).join('')}</div></section><section class="content-card"><h2 style="font:23px Georgia,serif">Crafting nook</h2><p style="color:var(--muted);font-size:11px">Turn spare discoveries into useful things.</p><div class="level-list"><div class="level-item"><span class="emoji">🧴</span><div><strong>Canopy tonic</strong><small>5 elements · restore 30 HP</small></div><button class="mini-button" onclick="craftItem('tonic')">Craft</button></div><div class="level-item"><span class="emoji">🌟</span><div><strong>Starfall charm</strong><small>1 T2 element · 3 stardust</small></div><button class="mini-button" onclick="craftItem('charm')">Craft</button></div><div class="level-item"><span class="emoji">🎁</span><div><strong>Mystery bundle</strong><small>2 stardust · a random element</small></div><button class="mini-button" onclick="craftItem('bundle')">Craft</button></div></div><div class="notice">Crafting recipes use your gathered inventory. Explore to stock up, or merge for rare materials.</div></section></div><div class="section-head"><div><h2>Power-ups</h2><p>One-time boosts for your next battle.</p></div></div><div class="forest-grid"><div class="card"><div style="font-size:27px">🛡️</div><b style="font-size:12px">Barkskin</b><p style="font-size:10px;color:var(--muted)">A sturdy shield against the next boss hit.</p><button class="mini-button" onclick="powerUp('shield')">Make · 20 ◈</button></div><div class="card"><div style="font-size:27px">⚡</div><b style="font-size:12px">Quickstep</b><p style="font-size:10px;color:var(--muted)">Add a burst of damage in the next fight.</p><button class="mini-button" onclick="powerUp('quickstep')">Make · 25 ◈</button></div><div class="card"><div style="font-size:27px">🍀</div><b style="font-size:12px">Lucky charm</b><p style="font-size:10px;color:var(--muted)">Improve your chance at a rare find.</p><button class="mini-button" onclick="powerUp('luck')">Make · 25 ◈</button></div></div>`}
function studioPage(){const code=`CANOPY-${STATE.levelNo.toString(36).toUpperCase()}${(STATE.xp%1296).toString(36).toUpperCase().padStart(2,'0')}`;return `<div class="page-title"><div><h1>Creator's clearing</h1><p>Make elements, design a level, or invite a friend into your rules.</p></div><span class="pill">✎ Studio</span></div><div class="two-col"><section class="content-card"><h2 style="font:22px Georgia,serif">Custom element maker</h2><p style="font-size:11px;color:var(--muted)">Add a personal T1 element to your world.</p><div class="form-row"><input id="customName" class="input" placeholder="Element name (e.g. Bloom)" maxlength="20"><input id="customIcon" class="input" placeholder="Icon 🌸" maxlength="4" style="max-width:90px"></div><div class="form-row"><select class="select" id="customStrength"><option>Water</option><option>Fire</option><option>Earth</option><option>Air</option></select><select class="select" id="customWeak"><option>Fire</option><option>Water</option><option>Air</option><option>Earth</option></select></div><button class="button" onclick="createElement()">Create element</button><div class="notice">Custom creations join your collection and can be merged with other T1 elements.</div><div class="recipe-list">${STATE.custom.map(x=>`<div class="recipe-item"><span>${x.icon}</span><div><strong>${safe(x.name)} <small>· Custom T1</small></strong><small>Strong vs ${x.strength} · Weak vs ${x.weak}</small></div></div>`).join('')}</div></section><section class="content-card"><h2 style="font:22px Georgia,serif">Level maker</h2><p style="font-size:11px;color:var(--muted)">Design a little trail, then play it immediately.</p><div class="form-row"><input id="levelName" class="input" placeholder="Your level name"><select id="levelTheme" class="select"><option>🌿 Mosslight Grove</option><option>🌙 Moonwell Clearing</option><option>🔥 Emberglow Hollow</option><option>🌊 Whispering Brook</option></select></div><div class="form-row"><select class="select" id="levelRarity"><option>Calm · Common finds</option><option>Curious · More mixed</option><option>Wild · Rare finds</option></select><input id="levelReward" class="input" type="number" min="10" max="100" value="30" placeholder="Reward"></div><button class="button" onclick="createLevel()">Save & play level</button><div class="section-head"><div><h2 style="font-size:18px">Community trails</h2><p>Custom levels live on this device.</p></div></div><div class="level-list">${STATE.customLevels.map((l,i)=>`<div class="level-item"><span class="emoji">${l.icon}</span><div><strong>${safe(l.name)}</strong><small>${safe(l.rarity)} · rank ${l.rank} · played ${l.plays}x</small></div><button class="mini-button" onclick="playLevel(${i})">Play</button></div>`).join('')||'<div class="notice">No custom trails yet. Make the first!</div>'}</div></section></div><div class="section-head"><div><h2>Gamemode workshop</h2><p>Set your own rules and share a room code with a friend.</p></div></div><section class="content-card"><div class="two-col"><div><h2 style="font:20px Georgia,serif">Custom rules</h2><div class="form-row"><input id="modeName" class="input" placeholder="Gamemode name"><select class="select" id="modeRule"><option>Double damage</option><option>One-heart challenge</option><option>Lucky forest</option><option>Free merge</option></select></div><button class="button" onclick="createMode()">Create gamemode</button><div class="recipe-list" style="margin-top:10px">${STATE.customModes.map(m=>`<div class="recipe-item"><span>🎮</span><div><strong>${safe(m.name)}</strong><small>${safe(m.rule)}</small></div><button class="mini-button" onclick="toast('Mode active: ${safe(m.name)}')">Play</button></div>`).join('')}</div></div><div><h2 style="font:20px Georgia,serif">Friend room</h2><p style="font-size:11px;color:var(--muted)">Share this code to invite a friend. Enter a friend's code to join their local challenge.</p><div class="notice" style="font-size:16px;text-align:center;letter-spacing:.14em;color:var(--lime)">${code}</div><div class="form-row"><button class="button secondary" onclick="copyCode('${code}')">Copy invite code</button></div><div class="form-row"><input id="joinCode" class="input" placeholder="Friend's room code"><button class="mini-button" onclick="joinRoom()">Join</button></div><small style="color:#8da495;font-size:9px">Room codes set up a friendly local challenge. Live online multiplayer is not connected in this offline build.</small></div></div></section>`}
function rankPage(){const rank=STATE.xp>4000?'Canopy Sage':STATE.xp>2200?'Star Forager':STATE.xp>900?'Greenheart':STATE.xp>300?'Wayfinder':'Seedling';STATE.rank=rank;return `<div class="page-title"><div><h1>Canopy standings</h1><p>Every discovery, duel, and trail adds to your renown.</p></div><span class="pill">♜ ${rank}</span></div><div class="two-col"><section class="content-card"><h2 style="font:23px Georgia,serif">Explorer ranks</h2><div class="level-list">${[['🌱','Seedling','0 renown'],['🧭','Wayfinder','300 renown'],['💚','Greenheart','900 renown'],['🌟','Star Forager','2,200 renown'],['🌳','Canopy Sage','4,000 renown']].map(([i,n,d])=>`<div class="level-item"><span class="emoji">${i}</span><div><strong>${n}</strong><small>${d}</small></div>${STATE.rank===n?'<span class="pill">Your rank</span>':''}</div>`).join('')}</div><div class="notice">You have earned ${STATE.xp.toLocaleString()} renown. Earn more by merging, exploring, and winning boss encounters.</div></section><section class="content-card"><h2 style="font:23px Georgia,serif">Leaderboards</h2><div class="form-row"><select class="select" onchange="showBoard(this.value)"><option value="renown">Canopy renown</option><option value="finds">Elements discovered</option><option value="bosses">Boss victories</option><option value="crafting">Crafting stars</option></select><span class="pill">Season I</span></div><div id="boardRows">${boardRows('renown')}</div></section></div><div class="section-head"><div><h2>Your achievements</h2><p>Small milestones, lovely memories.</p></div></div><div class="forest-grid">${[['🔍','Curious','Discover 5 elements',STATE.discovered.size>=5],['⚗️','First spark','Make your first merge',STATE.crafted>0],['🛡️','Grove guardian','Win a boss fight',STATE.wins>3],['🗺️','Pathfinder','Play a custom level',STATE.customLevels.some(l=>l.plays>0)]].map(([i,n,d,done])=>`<div class="card"><div style="font-size:25px">${i}</div><strong style="font-size:12px">${n} ${done?'✓':'🔒'}</strong><p style="font-size:10px;color:var(--muted);margin-bottom:0">${d}</p></div>`).join('')}</div><div class="section-head"><div><h2>Titles & auras</h2><p>Choose a little bit of flair for your explorer.</p></div></div><section class="content-card"><div class="forest-grid"><button class="biome" data-emoji="🍃" onclick="setTitle('Leafbound')"><span class="level-tag">Title · unlocked</span><strong>Leafbound</strong><span>For the gentle wanderer</span></button><button class="biome" data-emoji="✨" onclick="setAura('Stardust')"><span class="level-tag">Aura · 25 ◈</span><strong>Stardust aura</strong><span>A twinkle around your portrait</span></button><button class="biome" data-emoji="🔥" onclick="setAura('Ember')"><span class="level-tag">Aura · 35 ◈</span><strong>Ember aura</strong><span>Warm glow, bright spirit</span></button></div></section>`}
function boardRows(type){let you=type==='finds'?STATE.discovered.size:type==='bosses'?STATE.wins:type==='crafting'?STATE.crafted:STATE.xp;let list=[['MossyMoth',type==='finds'?42:type==='bosses'?19:type==='crafting'?88:2840],['Fern Walker',you],['Emberling',type==='finds'?28:type==='bosses'?14:type==='crafting'?54:1960],['Cloudberry',type==='finds'?19:type==='bosses'?9:type==='crafting'?31:1420],['LittleLichen',type==='finds'?12:type==='bosses'?5:type==='crafting'?18:770]].sort((a,b)=>b[1]-a[1]);return `<div class="level-list">${list.map(([n,v],i)=>`<div class="level-item"><span class="emoji">${['🥇','🥈','🥉','🍃','🌱'][i]}</span><div><strong>${n}${n==='Fern Walker'?' · You':''}</strong><small>${type==='renown'?'Canopy renown':type==='finds'?'elements discovered':type==='bosses'?'boss victories':'crafts'}</small></div><b style="color:var(--gold)">${Number(v).toLocaleString()}</b></div>`).join('')}</div>`}
function showBoard(t){$('#boardRows').innerHTML=boardRows(t)}
function gather(place){const possible=place==='mystery'?['Water','Fire','Earth','Air']:place==='water'?['Water','Water','Air']:place==='fire'?['Fire','Fire','Earth']:place==='earth'?['Earth','Earth','Water']:['Air','Air','Water'];let chosen=possible[Math.floor(Math.random()*possible.length)];let lucky=Math.random();if(lucky>.94&&STATE.recipes&&Object.keys(STATE.recipes).length){let rare=Object.values(STATE.recipes).filter(r=>r.tier<=3);if(rare.length){let r=rare[Math.floor(Math.random()*rare.length)];chosen=r.name;toast(`Lucky find! ${r.icon} ${r.name}`)}}if(chosen==='Air'&&Math.random()>.94){STATE.coins+=6;toast('A coin glints among the leaves! +6 ◈')}STATE.inventory[chosen]=(STATE.inventory[chosen]||0)+1;STATE.discovered.add(chosen);STATE.explores++;STATE.coins+=3;STATE.xp+=4;levelCheck();render();if(!$('#toast').classList.contains('show'))toast(`Found ${getEl(chosen).icon} ${chosen}! +3 ◈`);save()}
function levelCheck(){let lvl=Math.floor(STATE.xp/500)+1;if(lvl>STATE.level){STATE.level=lvl;toast(`Level up! You reached level ${lvl}.`)}if(STATE.xp>=300)STATE.rank='Wayfinder';if(STATE.xp>=900)STATE.rank='Greenheart';if(STATE.xp>=2200)STATE.rank='Star Forager';if(STATE.xp>=4000)STATE.rank='Canopy Sage'}
function claimDaily(){const key='wildAlchemyDaily';let today=new Date().toDateString();if(localStorage.getItem(key)===today){toast('You already claimed today’s blessing.');return}localStorage.setItem(key,today);STATE.coins+=35;STATE.dust+=2;STATE.xp+=15;levelCheck();toast('Moonlit blessing: +35 coins, +2 stardust!');render();save()}
function buyItem(i){const cost=[35,55,80,40][i];if(STATE.coins<cost){toast('Not enough coins yet.');return}STATE.coins-=cost;if(i===0){STATE.playerHp=Math.min(100,STATE.playerHp+45);toast('Wild tonic: +45 HP!')}else if(i===1){STATE.dust+=3;toast('Stardust pouch opened! +3 ✧')}else if(i===2){STATE.collection.push('Mossweave cape');toast('Mossweave cape added to your collection!')}else{STATE.lucky=true;toast('Lucky acorn is ready for your next expedition!')}render();save()}
function craftItem(type){if(type==='tonic'){let items=Object.keys(STATE.inventory).filter(n=>STATE.inventory[n]>0);let amount=items.reduce((s,n)=>s+STATE.inventory[n],0);if(amount<5){toast('Gather 5 elements to craft a tonic.');return}let left=5;for(const n of items){let take=Math.min(left,STATE.inventory[n]);STATE.inventory[n]-=take;left-=take;if(!left)break}STATE.playerHp=Math.min(100,STATE.playerHp+30);toast('Canopy tonic crafted: +30 HP!')}else if(type==='charm'){let name=Object.keys(STATE.inventory).find(n=>STATE.inventory[n]>0&&getEl(n).tier===2);if(!name||STATE.dust<3){toast('Need a T2 element and 3 stardust.');return}STATE.inventory[name]--;STATE.dust-=3;STATE.collection.push('Starfall charm');toast('Starfall charm crafted!')}else{if(STATE.dust<2){toast('Need 2 stardust.');return}STATE.dust-=2;let n=BASE[Math.floor(Math.random()*4)].name;STATE.inventory[n]=(STATE.inventory[n]||0)+1;STATE.discovered.add(n);toast(`Mystery bundle: ${n}!`)}STATE.crafted++;render();save()}
function powerUp(type){let cost=type==='shield'?20:25;if(STATE.coins<cost){toast('Not enough coins.');return}STATE.coins-=cost;STATE.power=type;toast(`${type} power-up ready for the next encounter!`);render();save()}
function createElement(){let name=$('#customName').value.trim(),icon=$('#customIcon').value.trim()||'✨';if(name.length<2){toast('Give your element a name first.');return}if(allElements().some(e=>e.name.toLowerCase()===name.toLowerCase())){toast('That element name is already in your index.');return}let el={name,icon,tier:1,element:'custom',strength:$('#customStrength').value,weak:$('#customWeak').value};STATE.custom.push(el);STATE.inventory[name]=(STATE.inventory[name]||0)+1;STATE.discovered.add(name);STATE.xp+=10;levelCheck();toast(`${icon} ${name} has joined the Canopy!`);render();save()}
function createLevel(){let name=$('#levelName').value.trim()||`Trail ${STATE.customLevels.length+1}`,theme=$('#levelTheme').value,rarity=$('#levelRarity').value,icon=theme.split(' ')[0],reward=Math.max(10,Math.min(100,Number($('#levelReward').value)||30));STATE.customLevels.unshift({name,icon,rarity,theme,reward,plays:0,rank:'C'});toast(`Trail created: ${name}`);render();save()}
function playLevel(i){let l=STATE.customLevels[i];if(!l)return;l.plays++;let roll=Math.random();l.rank=roll>.75?'S':roll>.45?'A':roll>.2?'B':'C';let candidates=BASE.filter(x=>x.tier===1);let found=candidates[Math.floor(Math.random()*candidates.length)];STATE.inventory[found.name]=(STATE.inventory[found.name]||0)+1;STATE.discovered.add(found.name);STATE.coins+=l.reward;STATE.xp+=20;levelCheck();toast(`${l.rank} rank on ${l.name}! Found ${found.name}, +${l.reward} ◈`);render();save()}
function createMode(){let name=$('#modeName').value.trim()||`Wild Rules ${STATE.customModes.length+1}`,rule=$('#modeRule').value;STATE.customModes.unshift({name,rule});toast(`Gamemode “${name}” created.`);render();save()}
async function copyCode(code){try{await navigator.clipboard.writeText(code);toast('Room code copied! Send it to your friend.')}catch(e){toast(`Invite code: ${code}`)}}
function joinRoom(){let code=$('#joinCode').value.trim().toUpperCase();if(code.length<5){toast('Enter a valid friend room code.');return}toast(`Room ${code} found! Friendly challenge ready.`);STATE.customModes.unshift({name:`Room ${code}`,rule:'Friend challenge'});save()}
function setTitle(title){STATE.title=title;toast(`Title equipped: ${title}`);save()}
function setAura(aura){let cost=aura==='Stardust'?25:35;if(STATE.coins<cost){toast(`Need ${cost} coins to unlock this aura.`);return}STATE.coins-=cost;STATE.aura=aura;$('.portrait').style.boxShadow=aura==='Ember'?'0 0 22px #ff8e4c':'0 0 22px #d5f78b';toast(`${aura} aura equipped!`);render();save()}
function toggleSound(){STATE.sound=!STATE.sound;if(STATE.sound)playChime();render();save()}
function playChime(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[440,554,660].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.035,ctx.currentTime+i*.22);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.22+.5);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.22);o.stop(ctx.currentTime+i*.22+.52)})}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.add('hidden');if(e.key.toLowerCase()==='m'&&STATE.page!=='merge')navTo('merge')});
// Harmless local cheat codes, entered with the ? key on any page.
document.addEventListener('keydown',e=>{if(e.key==='?')openCheats()});
function openCheats(){$('#modal-box').innerHTML=`<h2>Forest whispers</h2><p>A few secret phrases for a playful boost. Codes work on this save only.</p><input class="input" id="cheatInput" placeholder="Enter a cheat code"><div class="modal-actions"><button class="button secondary" onclick="$('#modal').classList.add('hidden')">Close</button><button class="button" onclick="applyCheat()">Whisper</button></div>`;$('#modal').classList.remove('hidden')}
function applyCheat(){let code=$('#cheatInput').value.trim().toLowerCase();if(code==='leafmealone'){STATE.coins+=500;STATE.dust+=20;toast('The forest giggles. +500 coins, +20 stardust!')}else if(code==='wildthings'){for(const e of BASE){STATE.inventory[e.name]=(STATE.inventory[e.name]||0)+10;STATE.discovered.add(e.name)}toast('The forest is generous. +10 of every element!')}else if(code==='moonrise'){STATE.xp+=500;STATE.level+=1;levelCheck();toast('Moonrise! +500 renown.')}else{toast('No answer from the forest. Try another whisper.')}$('#modal').classList.add('hidden');render();save()}
load();if(localStorage.getItem('wildAlchemySave')){STATE.discovered=new Set(STATE.discovered);$('#welcome').classList.remove('hidden')}
</script>
</body>
</html>
