<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coinflip Kingdom</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Press+Start+2P&display=swap');
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#74b9ff;font-family:Fredoka,sans-serif;touch-action:none;user-select:none}
#game{display:block;width:100%;height:100%;image-rendering:auto}.hud{position:absolute;inset:0 0 auto 0;height:76px;display:flex;align-items:flex-start;justify-content:center;gap:4.5vw;padding:10px 16px;pointer-events:none;color:white;text-shadow:3px 3px 0 #263b78, -1px -1px 0 #263b78}.stat{text-align:center}.label{font-family:'Press Start 2P';font-size:10px;color:#fff3a5}.value{font-size:28px;font-weight:700;line-height:34px}.jumpbar{position:absolute;left:20px;bottom:18px;width:210px;height:28px;border:4px solid #263b78;border-radius:16px;background:rgba(255255255,.25);overflow:hidden}.jumpfill{height:100%;width:50%;background:linear-gradient(90deg,#ff5b6b,#ffdb52);transition:width .15s}.jumplabel{position:absolute;left:24px;bottom:52px;color:white;font:10px 'Press Start 2P';text-shadow:2px 2px #263b78}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(520px,calc(100vw - 32px));padding:28px 34px 24px;text-align:center;color:white;background:#263b78;border:6px solid white;border-radius:24px;box-shadow:0 10px 0 #172b5a,0 16px 30px #18285255}.panel h1{margin:0 0 10px;font-family:'Press Start 2P';font-size:28px;line-height:1.35;color:#ffdf4f;text-shadow:4px 4px #cc3d55}.panel p{margin:10px 0 18px;font-size:18px}.panel button{border:0;border-radius:14px;padding:15px 24px;background:#ffcf38;color:#263b78;font:700 18px Fredoka;box-shadow:0 6px #d08a22;cursor:pointer}.panel button:active{transform:translateY(4px);box-shadow:0 2px #d08a22}.hidden{display:none}.controls{position:absolute;inset:auto 16px 12px 16px;height:94px;display:flex;justify-content:space-between;pointer-events:none}.controls button{pointer-events:auto;width:82px;height:82px;border:4px solid rgba(255255255,.9);border-radius:50%;background:rgba(38,59,120,.65);color:white;font-size:38px;box-shadow:0 5px 12px #2d4e7955}.controls .rightset{display:flex;gap:10px}.flash{animation:flash .25s}@keyframes flash{50%{filter:brightness(2)}}
@media(min-width:800px){.controls{opacity:.5}.controls button{width:70px;height:70px}}
@media(max-height:500px){.hud{height:58px}.value{font-size:22px}.label{font-size:8px}.jumpbar,.jumplabel{display:none}.controls{height:76px}.controls button{width:64px;height:64px}.panel{padding:18px 24px}.panel h1{font-size:21px}.panel p{font-size:15px;margin:6px 0 12px}}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="stat"><div class="label">COINS</div><div class="value" id="coins">0</div></div><div class="stat"><div class="label">STOMPS</div><div class="value" id="kills">0</div></div><div class="stat"><div class="label">SPEED</div><div class="value" id="speed">1.0×</div></div></div>
<div class="jumplabel">JUMP POWER</div><div class="jumpbar"><div class="jumpfill" id="jumpfill"></div></div>
<div id="panel" class="panel"><h1 id="title">COINFLIP</h1><p id="subtitle">Collect coins to jump higher.<br>Enemies make you jump lower.</p><button id="action">START</button></div>
<div class="controls"><button id="left">◀</button><div class="rightset"><button id="down">▼</button><button id="jump">A</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,scale;
function resize(){W=c.width=Math.floor(innerWidth*devicePixelRatio);H=c.height=Math.floor(innerHeight*devicePixelRatio);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';scale=Math.min(W/900,H/520)}resize();addEventListener('resize',resize);
const $=s=>document.querySelector(s),keys={};let state='menu',camera=0,level=1,coins=0,kills=0,baseSpeed=220,gameSpeed=1,jumpPower=550;
const world={w:5100,h:520};
function makeLevel(){let ground=[{x:-100,w:850,y:440,h:100},{x:870,w:700,y:440,h:100},{x:1700,w:620,y:440,h:100},{x:2470,w:760,y:440,h:100},{x:3380,w:700,y:440,h:100},{x:4220,w:980,y:440,h:100}];let platforms=[{x:330,y:330,w:160,h:28},{x:620,y:270,w:150,h:28},{x:960,y:340,w:170,h:28},{x:1190,y:250,w:150,h:28},{x:1540,y:330,w:180,h:28},{x:2020,y:310,w:200,h:28},{x:2300,y:220,w:150,h:28},{x:2730,y:330,w:170,h:28},{x:3020,y:250,w:180,h:28},{x:3500,y:320,w:190,h:28},{x:3820,y:230,w:150,h:28},{x:4260,y:330,w:180,h:28},{x:4520,y:250,w:150,h:28}];let coinPos=[];for(let i=0;i<45;i++){coinPos.push({x:260+i*105+(i%3)*35,y:160+(i%5)*42,got:false})}let enemies=[];[1050,1810,2170,2880,3600,3970,4400,4690].forEach((a,i)=>enemies.push({x:a,y:408,w:34,h:32,vx:(i%2?-.7:.7)*55,alive:true,ang:0}));world.ground=ground;world.platforms=platforms;world.coins=coinPos;world.enemies=enemies}
makeLevel();let p={x:100,y:380,w:38,h:50,vx:0,vy:0,on:false,face:1,inv:0};
function resetLife(fast=true){p.x=100;p.y=380;p.vx=0;p.vy=0;p.inv=1;if(fast){gameSpeed=Math.min(2.2,gameSpeed+.12)}camera=0;makeLevel();updateHud()}
function start(){coins=0;kills=0;level=1;gameSpeed=1;jumpPower=550;p={x:100,y:380,w:38,h:50,vx:0,vy:0,on:false,face:1,inv:0};makeLevel();camera=0;state='play';$('#panel').classList.add('hidden');updateHud()}
function updateHud(){coinsEl=0;$('#coins').textContent=coins;$('#kills').textContent=kills;$('#speed').textContent=gameSpeed.toFixed(1)+'×';$('#jumpfill').style.width=Math.max(8,Math.min(100,(jumpPower-320)/620*100)+'%')}
let coinsEl=0;
$('#action').onclick=start;
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function jump(){if(state==='play'&&p.on){p.vy=-jumpPower;p.on=false}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();if(e.key==='Enter'&&state!=='play')start()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
[['left','arrowleft','a'],['right','arrowright','d']].forEach(([id,_,key])=>{let el=$('#'+id);el.onpointerdown=e=>{e.preventDefault();keys[key]=true};el.onpointerup=()=>keys[key]=false;el.onpointerleave=()=>keys[key]=false});
// right button is handled as D
$('#jump').onpointerdown=e=>{e.preventDefault();jump()};$('#down').onpointerdown=e=>{e.preventDefault();keys['arrowdown']=true};$('#down').onpointerup=()=>keys['arrowdown']=false;
let last=performance.now(),frame=0;
function update(dt){if(state==='play'){dt=Math.min(dt,.032)*gameSpeed;let left=keys.arrowleft||keys.a,right=keys.arrowright||keys.d;p.vx=left?-220:right?220:0;if(left)p.face=-1;if(right)p.face=1;if(p.on&&keys.ArrowDown)p.vy=-jumpPower*.3;p.on=false;p.vy+=1500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0)p.x=0;if(p.x+p.w>world.w)p.x=world.w-p.w;for(let g of [...world.ground,...world.platforms]){if(p.vy>=0&&p.x+p.w>g.x&&p.x<g.x+g.w&&p.y+p.h>=g.y&&p.y+p.h-p.vy*dt<=g.y){p.y=g.y-p.h;p.vy=0;p.on=true}}for(let q of world.coins){if(!q.got&&p.x+p.w>q.x-14&&p.x<q.x+14&&p.y+p.h>q.y-14&&p.y<q.y+14){q.got=true;coins++;jumpPower=Math.min(760,jumpPower+18);frame=20;updateHud()}}for(let m of world.enemies){if(!m.alive)continue;m.x+=m.vx*dt;if(m.x<world.ground[0].x||m.x>world.w)m.vx*=-1;let hit=rect(p,m);if(hit){if(p.vy>120&&p.y+p.h-m.y<24){m.alive=false;p.vy=-Math.min(jumpPower*.55,430);kills++;jumpPower=Math.max(330,jumpPower-26);updateHud()}else if(p.inv<=0){p.inv=1;showPanel('YOU DIED','The world gets 12% faster.','TRY AGAIN',true)}}m.ang+=dt*5}p.inv-=dt;if(p.y>580){p.inv=1;showPanel('YOU FELL','Every death is faster.','TRY AGAIN',true)}if(p.x>4900){gameSpeed=Math.min(2.4,gameSpeed+.1);state='clear';worldComplete()}}camera+=(p.x-260-camera)*Math.min(1,dt*5);camera=Math.max(0,Math.min(world.w-innerWidth/scale,camera));p.inv=Math.max(0,p.inv)}}
function showPanel(title,sub,button,death){gameSpeed=Math.min(2.2,gameSpeed+.12);state='dead';$('#title').textContent=title;$('#subtitle').innerHTML=sub;$('#action').textContent=button;$('#panel').classList.remove('hidden');updateHud()}
function worldComplete(){gameSpeed=Math.min(2.4,gameSpeed+.1);$('#title').textContent='COURSE CLEAR!';$('#subtitle').innerHTML='Coins +'+coins+' &nbsp; • &nbsp; Stomps '+kills+'<br>The next run is '+gameSpeed.toFixed(1)+'× speed.';$('#action').textContent='PLAY AGAIN';$('#panel').classList.remove('hidden');updateHud()}
function coinShape(cx,cy,r){x.save();x.translate(cx,cy);x.scale(.62,1);x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fillStyle='#ffcf38';x.fill();x.strokeStyle='#f19c32';x.lineWidth=5;x.stroke();x.beginPath();x.moveTo(-1,-r*.55);x.lineTo(-1,r*.55);x.strokeStyle='#fff6a3';x.lineWidth=4;x.stroke();x.restore()}
function draw(){let vw=W/scale,vh=H/scale,xw=vW=vH=0;x.setTransform(scale,0,0,scale,0,0);let sky=x.createLinearGradient(0,0,0,520);sky.addColorStop(0,'#58adee');sky.addColorStop(.75,'#8bd3ef');x.fillStyle=sky;x.fillRect(0,0,900,520);x.save();x.translate(-camera*.18,0);drawCloud(100,100);drawCloud(520,70);drawCloud(820,140);drawHill(180,440);drawHill(510,440);drawHill(780,440);x.restore();x.save();x.translate(-camera,0);
for(let g of world.ground){x.fillStyle='#6bc94e';x.fillRect(g.x,g.y,g.w,g.h);x.fillStyle='#cd7a43';for(let i=0;i<g.w;i+=32)x.fillRect(g.x+i,g.y+10,28,g.h);x.fillStyle='#9bd86b';x.fillRect(g.x,g.y, g.w,12)}
for(let g of world.platforms){x.fillStyle='#df8a49';x.fillRect(g.x,g.y,g.w,g.h);x.fillStyle='#b45e35';x.fillRect(g.x,g.y+g.h-7,g.w,7);x.fillStyle='#ffe08a';for(let i=0;i<g.w;i+=32)x.fillRect(g.x+i+5,g.y+6,22,6)}
for(let q of world.coins)if(!q.got)coinShape(q.x,q.y,16);
for(let m of world.enemies){if(!m.alive)continue;x.save();x.translate(m.x+m.w/2,m.y+m.h/2);x.scale(m.vx<0?-1:1,1);x.fillStyle='#7c4aa5';x.beginPath();x.moveTo(-17,16);x.lineTo(-15,-8);x.quadraticCurveTo(0,-26,15,-8);x.lineTo(17,16);x.fill();x.fillStyle='#fff';x.fillRect(-11,-5,9,10);x.fillRect(5,-5,9,10);x.fillStyle='#263b78';x.fillRect(-7,-2,4,7);x.fillRect(8,-2,4,7);x.fillStyle='#5f3586';x.fillRect(-16,12,12,5);x.fillRect(4,12,12,5);x.restore()}
// player
if(p.inv%0.14<0.07){x.save();x.translate(p.x+p.w/2,p.y+p.h/2);x.scale(p.face,1);x.fillStyle='#263b78';x.fillRect(-18,-24,36,8);x.fillStyle='#ee5b44';x.fillRect(-15,-16,30,25);x.fillStyle='#ffe0bd';x.fillRect(-13,-10,26,14);x.fillStyle='#263b78';x.fillRect(-12,15,9,10);x.fillRect(4,15,9,10);x.fillStyle='#3b78b5';x.fillRect(-10,8,20,11);x.fillStyle='#ffe0bd';x.beginPath();x.arc(0,-16,10,0,Math.PI*2);x.fill();x.fillStyle='#263b78';x.fillRect(-11,-27,22,7);x.fillRect(-8,-32,14,7);x.fillStyle='#263b78';x.fillRect(5,-18,3,3);x.restore()}
// goal
x.fillStyle='#263b78';x.fillRect(4840,170,12,270);x.fillStyle='#ee5b44';x.beginPath();x.moveTo(4852,176);x.lineTo(4930,205);x.lineTo(4852,234);x.fill();x.fillStyle='#ffe16a';x.beginPath();x.arc(4846,170,15,0,Math.PI*2);x.fill();x.restore();x.setTransform(1,0,0,1,0,0)}
function drawCloud(a,b){x.fillStyle='rgba(255,255,255,.86)';x.beginPath();x.arc(a,b,25,0,7);x.arc(a+30,b-8,32,0,7);x.arc(a+65,b,26,0,7);x.fillRect(a-5,b,75,24);x.fill()}
function drawHill(a,b){x.fillStyle='#55b84d';x.beginPath();x.moveTo(a-100,b);x.quadraticCurveTo(a-50,b-120,a,b);x.quadraticCurveTo(a+50,b-120,a+100,b);x.fill()}
function loop(now){let dt=(now-last)/1000;last=now;update(dt);draw();frame=Math.max(0,frame-1);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
